# Rename this to extra_model_paths.yaml and ComfyUI will load it
# config for comfyui with network-first (X), then D, then C

comfyui:
  # Network base path - centralized storage location
  base_path: X:/AI
  # You can use is_default to mark that these folders should be listed first, and used as the default dirs for eg downloads
  is_default: true

  # Core model types
  checkpoints: |
    models/checkpoints
    D:/AI/models/checkpoints
    C:/AI/models/checkpoints

  clip: |
    models/clip
    D:/AI/models/clip
    C:/AI/models/clip

  clip_vision: |
    models/clip_vision
    D:/AI/models/clip_vision
    C:/AI/models/clip_vision

  configs: |
    models/configs
    D:/AI/models/configs
    C:/AI/models/configs

  controlnet: |
    models/controlnet
    D:/AI/models/controlnet
    C:/AI/models/controlnet

  diffusion_models: |
    models/diffusion_models
    models/unet
    D:/AI/models/diffusion_models
    D:/AI/models/unet
    C:/AI/models/diffusion_models
    C:/AI/models/unet

  embeddings: |
    models/embeddings
    D:/AI/models/embeddings
    C:/AI/models/embeddings

  loras: |
    models/loras
    D:/AI/models/loras
    C:/AI/models/loras

