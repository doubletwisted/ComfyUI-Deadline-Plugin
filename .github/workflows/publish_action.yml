name: Publish to Comfy registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check whether this should publish
        id: publish-check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff "${{ github.event.before }}" "${{ github.sha }}" -- pyproject.toml | grep -E '^[+-]version = '; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "pyproject.toml changed, but the version did not. Skipping registry publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.publish-check.outputs.publish == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install comfy-cli
        if: steps.publish-check.outputs.publish == 'true'
        run: python -m pip install --upgrade pip comfy-cli

      - name: Publish Custom Node
        if: steps.publish-check.outputs.publish == 'true'
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          comfy --skip-prompt --no-enable-telemetry env
          comfy node publish --token "$REGISTRY_ACCESS_TOKEN"
